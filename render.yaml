services:
  # 1. Backend FastAPI Service
  - type: web
    name: smartbiz-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: SECRET_KEY
        value: generate_a_secure_random_key_here
      - key: ALGORITHM
        value: HS256
      - key: DATABASE_URL
        value: sqlite:///./smartbiz_dev.db # Or your production MySQL URL

  # 2. Frontend React static site
  - type: web
    name: smartbiz-frontend
    env: static
    buildCommand: npm run build
    publishPath: frontend/dist
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
